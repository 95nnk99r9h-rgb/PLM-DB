name: Deploy auf GitHub Pages

on:
  push:
    branches:
      - main
      # Damit sich der Stand auch vor dem Zusammenführen ansehen lässt:
      - claude/planlauf-management-app-5jn9sa
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Ergebnis für die Veröffentlichung über GitHub Actions (empfohlene Quelle)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Notausgang: die gebaute Fassung zusätzlich im Branch unter app/ ablegen.
      # Damit funktioniert die Seite auch dann, wenn GitHub Pages weiterhin den
      # Repository-Stamm ausliefert – index.html wechselt dann automatisch dorthin.
      - name: Gebaute Fassung unter app/ im Branch ablegen
        run: |
          rm -rf app
          cp -r dist app
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app .nojekyll
          if git diff --cached --quiet; then
            echo "Gebaute Fassung unverändert."
          else
            git commit -q -m "Gebaute Fassung aktualisieren [skip ci]"
            git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Zusätzlich als Branch gh-pages ablegen. Damit funktioniert die Seite
      # auch dann, wenn unter Settings → Pages die Quelle "Deploy from a branch"
      # eingestellt bleibt – dort ist dann gh-pages / root zu wählen.
      - name: Build als gh-pages-Branch veröffentlichen
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build aus ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
