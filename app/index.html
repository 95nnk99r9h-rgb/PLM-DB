<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MC Plan – Planlaufmanagement</title>
    <meta name="description" content="MC Plan – Planlaufmanagement für Projekte, Planpakete und Planverzeichnisse" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MC Plan" />
    <script type="module" crossorigin src="./assets/index-CBV7-wOb.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DBkbldbb.css">
  </head>
  <body>
    <div id="root">
      <!--
        Dieser Bereich ist nur sichtbar, solange die Anwendung nicht gestartet
        ist – React ersetzt den Inhalt von #root beim Laden.

        Wird die Seite statisch ausgeliefert (GitHub Pages mit der Quelle
        "Deploy from a branch" liefert den Quellcode statt des Builds), startet
        die Anwendung nicht. Das Skript unten wechselt dann automatisch zur
        gebauten Fassung im Unterverzeichnis ./app/, die der Workflow bei jedem
        Push dort ablegt. Fehlt auch diese, bleibt der Hinweis stehen.
      -->
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 40rem; margin: 12vh auto; padding: 0 1.5rem; color: #1d1d1f; line-height: 1.5;">
        <h1 style="font-size: 1.3rem; margin: 0 0 .75rem;">MC Plan wird geladen …</h1>
        <p style="margin: 0 0 1rem; color: #6e6e73;">
          Falls diese Meldung stehen bleibt, wird der Quellcode ausgeliefert und nicht die gebaute
          Anwendung. Auf GitHub Pages hilft: <strong>Settings → Pages → Build and deployment →
          Source: GitHub Actions</strong>.
        </p>
        <p style="margin: 0; color: #6e6e73;">
          Lokal wird die Anwendung mit <code style="background: #f5f5f7; padding: .1rem .35rem; border-radius: 4px;">npm run dev</code>
          gestartet oder mit <code style="background: #f5f5f7; padding: .1rem .35rem; border-radius: 4px;">npm run build</code> gebaut.
        </p>
      </div>
    </div>
    <script>
      /*
        Notausgang für statisch ausgelieferten Quellcode: Startet die Anwendung
        nicht innerhalb von 1,5 Sekunden, wird auf die gebaute Fassung unter
        ./app/ gewechselt. Im Entwicklungsbetrieb und im fertigen Build meldet
        sich die Anwendung über window.planlaufGestartet und der Wechsel entfällt.
      */
      (function () {
        if (/\/app\/?$/.test(location.pathname)) return;
        var zeitgeber = setTimeout(function () {
          location.replace('app/' + location.hash);
        }, 1500);
        window.planlaufGestartet = function () {
          clearTimeout(zeitgeber);
        };
      })();
    </script>
  </body>
</html>
